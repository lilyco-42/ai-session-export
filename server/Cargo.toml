[package]
name = "ai-session-export-server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local read-only AI session export server with Lilyco CLI/MCP commands"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
lilyco = { path = "/home/lilyco/code/lilyco/lilyco", version = "0.3.0", default-features = false }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tower-http = { version = "0.7.1", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"