[package]
name = "ai-session-export-server"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local read-only AI session export server with Lilyco CLI/MCP commands"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
lilyco = { git = "https://github.com/lilyco-42/lilyco.git", rev = "14a81a6a3b4434a1a08667d0c6190dbb6e894d32", default-features = false }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tower-http = { version = "0.7.1", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"