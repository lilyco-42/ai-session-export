name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: macos-15, target: aarch64-apple-darwin}
          - {runner: windows-2022, target: x86_64-pc-windows-msvc}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable "${{ matrix.target }}"
      - name: Build frontend
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build
      - name: Test backend
        run: cargo +stable test --locked --manifest-path server/Cargo.toml --target "${{ matrix.target }}"
      - name: Build backend
        run: cargo +stable build --locked --release --manifest-path server/Cargo.toml --target "${{ matrix.target }}"
      - name: Package and smoke test
        run: python scripts/package_release.py "${{ matrix.target }}" --smoke-test
      - name: Test installer (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd release-assets
          shasum -a 256 *.tar.gz > SHA256SUMS
          cd ..
          export AI_SESSION_RELEASE_DIR="$PWD/release-assets"
          export AI_SESSION_INSTALL_PREFIX="$(mktemp -d)"
          sh install.sh
          sh install.sh
          "$AI_SESSION_INSTALL_PREFIX/bin/ai-session-export" --help
          rm release-assets/SHA256SUMS
      - name: Test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = Get-ChildItem release-assets/*.zip
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($asset.Name)" | Set-Content release-assets/SHA256SUMS
          $root = Join-Path $env:RUNNER_TEMP ('installer-' + [Guid]::NewGuid())
          ./install.ps1 -ReleaseDir (Resolve-Path release-assets).Path -InstallRoot $root -NoPath
          ./install.ps1 -ReleaseDir (Resolve-Path release-assets).Path -InstallRoot $root -NoPath
          & (Join-Path $root 'app/ai-session-export-server.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed' }
          Remove-Item release-assets/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify all assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh install.ps1 release-assets/
          cd release-assets
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            case "$target" in
              *windows*) ext=zip ;;
              *) ext=tar.gz ;;
            esac
            test -s "ai-session-export-${target}.${ext}"
          done
          sha256sum ai-session-export-*.tar.gz ai-session-export-*.zip install.sh install.ps1 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]]; then
              echo "Release $TAG is already published; refusing to overwrite it."
              exit 1
            fi
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --generate-notes --draft "${flags[@]}"
          fi
          gh release edit "$TAG" --draft=false
